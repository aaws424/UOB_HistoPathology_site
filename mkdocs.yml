site_name: Virtual Pathology Atlas
site_url: https://example.com
theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.tabs.link

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js
  - javascripts/viewer.js

nav:
  - Home: index.md
  - Inflammation:
      - Gastritis: data/inflammation/gastritis.md
  - Organs:
      - Spleen: data/organs/spleen.md
